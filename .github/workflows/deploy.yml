name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          # 从 GitHub Secrets / Variables 读取环境变量注入打包档案
          VITE_GAS_API_URL: ${{ secrets.VITE_GAS_API_URL }}
          VITE_TOTAL_QUESTIONS: ${{ vars.VITE_TOTAL_QUESTIONS || 10 }}
          VITE_TEACHER_ID: ${{ secrets.VITE_TEACHER_ID || 'admin' }}
          VITE_TEACHER_PASSWORD: ${{ secrets.VITE_TEACHER_PASSWORD || 'pixel' }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
